# DS-06 / PHY-03 · Reviewed findings served by GET /v1/findings and shown on the dashboard "Insights" page.
# UI text in English; the full Spanish write-up of each finding is in docs/03_data_science/findings/F-0X.md.
# Every number here appears in RESEARCH_LOG.md (R-codes) and is reproducible with scripts/research/r0X_*.py.
# Regime: microgravity (ISS). Nothing here is partial-gravity evidence.
reviewed_by: Alexander Moon (PHY)
reviewed_on: "2026-11-15"
findings:
  - id: F-01
    title: "Oxygen is the dominant control of how long a burning flame lasts"
    title_es: "El oxígeno es el control dominante de cuánto dura una llama ya encendida"
    claim: >-
      In CFI-G normal spherical flames, each +0.05 of oxygen mole fraction multiplies the typical burn duration by about
      2.3 and cuts the instantaneous risk of self-extinction by about 81 %.
    pillar: prevention
    rq: RQ1
    confidence: high
    status: reviewed
    key_numbers:
      - {name: "Hazard ratio of self-extinction per +0.05 O2", value: 0.19, ci95: [0.13, 0.29], n: 132, groups: "11 days", method: "Cox, cluster-robust by day"}
      - {name: "Time ratio per +0.05 O2", value: 2.29, ci95: [1.90, 2.55], n: 132, method: "Weibull AFT, day bootstrap"}
    evidence: {psi: [PSI-159], research_log: [R13, R17], model_card: M-01, notebook: notebooks/03_modeling/03_m1_ignition_survival_am.ipynb}
    physics: >-
      Less nitrogen means less inert gas absorbing heat, so the flame is hotter and stays above the temperature at which
      radiative heat losses extinguish spherical flames in microgravity.
    limits: "CFI-G normal flames were tested at O2 ~0.18-0.23 and ~0.33-0.40 only; microgravity; gas fuels."
    page: insights
  - id: F-02
    title: "A four-term physical law predicts flame duration and transfers to another fuel and campaign"
    title_es: "Una ley física de cuatro términos predice la duración de la llama y se transfiere a otro combustible y campaña"
    claim: >-
      ln t = 15.8 - 13.4 (1000/Tad) - 0.41 ln p - 1.20 ln m + 2.12 ln L. Fitted on CFI-G alone it ranks the burn times of
      Flame Design ethylene flames it never saw with a C-index of 0.93 and the right scale (calibration slope 1.16).
    pillar: prevention
    rq: RQ1
    confidence: medium
    status: reviewed
    key_numbers:
      - {name: "Out-of-sample C-index (leave one day out, both campaigns)", value: 0.89, n: 255, groups: "24 days"}
      - {name: "Transfer C-index, CFI-G -> Flame Design", value: 0.93, ci95: [0.80, 0.96], n: 135}
      - {name: "Transfer calibration slope (1 = perfect)", value: 1.16, ci95: [0.72, 1.48], n: 135}
      - {name: "1000/Tad coefficient", value: -13.4, ci95: [-17.4, -10.4], unit: "per 1000/K"}
      - {name: "ln pressure coefficient", value: -0.41, ci95: [-0.84, -0.12]}
    evidence: {psi: [PSI-159, PSI-10], research_log: [R2, R9, R12, R13, R18], model_card: M-01, script: scripts/research/r03_m1v2_lunar_ramps.py}
    physics: >-
      Hotter flames (Tad) resist radiative extinction; higher pressure and larger burner flows make bigger, sootier flames
      that radiate more; a flame sitting closer to the burner (larger L) loses less. All four signs match radiative extinction.
    limits: "Inverse flames rank but do not calibrate across campaigns; Flame Design flames last ~1.75x longer at equal physics (fuel or rig)."
    page: insights
  - id: F-03
    title: "Observed burn durations were longer near the exploration atmosphere"
    title_es: "Las duraciones observadas fueron mayores cerca de la atmósfera de exploración"
    claim: >-
      At 34 % O2 and 56.5 kPa (oxygen partial pressure close to sea level) real tests burned a median 62.5 s before
      self-extinguishing, versus 9 s near the ISS cabin. The cohorts differ in fuel composition and test conditions.
    pillar: prevention
    rq: RQ1
    confidence: medium
    status: reviewed
    key_numbers:
      - {name: "Observed median burn, ISS-like (21 % O2, 101 kPa)", value: 9.0, unit: s, n: 23, groups: "6 days"}
      - {name: "Observed median burn, exploration (34 % O2, 56.5 kPa), self-extinguished", value: 62.5, unit: s, n: 12, groups: "3 days"}
      - {name: "Model median, exploration (propane source)", value: 94.6, ci90: [74.6, 120.2], unit: s}
      - {name: "Calculated Tad, ISS vs exploration (propane, 30 % fuel)", value: "2171 K vs 2512 K"}
      - {name: "Hazard ratio of self-extinction per doubling of pressure", value: 2.2, ci95: [1.5, 3.3]}
    evidence: {psi: [PSI-159], research_log: [R13, R14], atmospheres: docs/04_physics/HABITAT_ATMOSPHERES.md}
    physics: >-
      Lungs respond to oxygen partial pressure, flames also to the inert fraction: with ~34 % O2 the flame is ~340 K hotter.
      Lower pressure also lengthens flame life in these data (less radiation), so both choices push the same way.
    limits: "Nineteen nearby tests span three days and use no propane. The propane estimate is separate. Four flames were still lit at flow cutoff."
    page: atmosphere
  - id: F-04
    title: "Knowledge gap: no tests near the lunar-base atmosphere and none in partial gravity"
    title_es: "Brecha: no hay pruebas cerca de la atmósfera de base lunar ni en gravedad parcial"
    claim: >-
      The analyzed PSI data contain zero normal-flame tests within ±0.05 O2 and ±25 % pressure of the lunar-base bound (30 % O2, 70 kPa), no
      CFI-G normal-flame tests between 24 % and 33 % O2 (Flame Design has only 6 ethylene flames near 30 % O2 at 1 atm,
      with no burn time recorded). The analyzed data provide no measurement of the effect of lunar or Martian gravity.
    pillar: prevention
    rq: RQ1
    confidence: high
    status: reviewed
    key_numbers:
      - {name: "CFI-G normal-flame tests near 30 % O2 / 70 kPa", value: 0}
      - {name: "Model reading there (interpolation, tier B)", value: 59.6, ci90: [48.2, 72.3], unit: s}
      - {name: "Distance to the 5th nearest tested flame vs typical spacing", value: 2.15}
    evidence: {psi: [PSI-159, PSI-10], research_log: [R14], physics: docs/04_physics/PARTIAL_GRAVITY_BOUNDING.md}
    physics: >-
      Buoyancy could change the radiative extinction mechanism. The data do not establish the direction or magnitude of the change.
    limits: "The model reading inside the gap is an interpolation, not a measurement."
    page: gaps
    next_experiment: "Normal spherical flames at 30 % O2 / 70 kPa and across 24-33 % O2, then the same set in partial gravity."
  - id: F-05
    title: "Flame contraction preceded self-extinction in a retrospective video analysis"
    title_es: "La llama se encoge antes de apagarse sola: una alerta óptica temprana"
    claim: >-
      In the ISS video of every CFI-G test, 71 % of normal flames that later self-extinguished were already below 80 % of
      their mid-life radius 5-10 s before going out, versus 32 % of flames that kept burning until the flow was cut. The
      fading of the yellow soot glow did not distinguish these groups.
    pillar: detection
    rq: RQ1
    confidence: medium
    status: reviewed
    key_numbers:
      - {name: "AUC, radius 10-5 s before the end", value: 0.76, ci95: [0.67, 0.86], n: 67}
      - {name: "AUC, radius 15-10 s before the end", value: 0.73, ci95: [0.62, 0.84], n: 67}
      - {name: "Radius 10-5 s before the end, self-extinguished vs flow-cut", value: "0.62 vs 0.99 of mid-life"}
      - {name: "AUC of soot-glow fading (negative result)", value: 0.45, ci95: [0.24, 0.63], n: 126}
    evidence: {psi: [PSI-159], research_log: [R11, R16, R19, R20], script: scripts/research/r05_video_all_cfig.py, video_job: deploy/VIDEO_JOB.md}
    physics: >-
      Near the radiative limit the reaction zone weakens and contracts, often oscillating, before it fails; the optical
      sensors showed the same oscillation in the time series (R11).
    limits: "Retrospective (the end is known); inverse flames too dim to measure; false-alarm rate over a flame's life not yet measured."
    page: insights
