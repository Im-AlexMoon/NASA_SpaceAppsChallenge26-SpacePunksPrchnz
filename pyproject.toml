[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "flamesafe"
version = "0.1.0"
description = "SI-powered dashboard that summarizes, ranks and interprets NASA PSI microgravity combustion investigations for space fire safety (NASA Space Apps 2026 - Flames in Free Fall)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "SpacePunks" }]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "tenacity>=8.3",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
pipeline = [
    "pandas>=2.2",
    "pyarrow>=16",
    "duckdb>=1.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pandera>=0.20",
]
analysis = [
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "plotly>=5.22",
    "jupyterlab>=4.2",
]
ml = [
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "shap>=0.45",
    "mapie>=0.8",
    "joblib>=1.4",
]
rag = [
    "anthropic>=0.40",
    "sentence-transformers>=3.0",
    "lancedb>=0.10",
    "rank-bm25>=0.2",
    "pypdf>=4.2",
]
app = [
    "streamlit>=1.37",
    "plotly>=5.22",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pre-commit>=3.7",
]
all = ["flamesafe[pipeline,analysis,ml,rag,app,dev]"]

[project.scripts]
flamesafe = "flamesafe.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/flamesafe"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: needs network (live PSI API) or local bronze data",
]
