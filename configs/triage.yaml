# DE-05 · Triage of the 24 PSI combustion investigations.
# Method: docs/02_data_engineering/TRIAGE_METHODOLOGY.md §3. Evidence: docs/02_data_engineering/investigations/PSI-XX.md
# Scores 0-3 per criterion are a DE proposal; PHY-02 validates pillar/environment and R1, and may add an `override`.
# `flamesafe triage` computes score + tier and renders the matrix (never edit the rendered table by hand).

weights: {R1: 0.30, R2: 0.15, R3: 0.20, R4: 0.20, R5: 0.10, R6: 0.05}
thresholds: {tier1: 0.70, tier2: 0.45}
gates:
  # Added in DE-05 (see ADR-0002): a high weighted score alone must not promote a record with no analyzable outcome.
  tier1: {R4_min: 3, R3_min: 2, R5_min: 2}   # measured outcome under varied conditions, tabular, n >= 30
  tier2: {R3_or_R4_min: 2}                   # something analyzable; otherwise context only

# pillars: prevencion | deteccion | supresion
# environments: nave | estacion | base_lunar | rover | marte
investigations:
  PSI-159:
    scores: {R1: 3, R2: 3, R3: 3, R4: 3, R5: 3, R6: 3}
    pillars: [prevencion]
    environments: [nave, estacion, base_lunar, rover, marte]
    rqs: [RQ1, RQ5]
    justification: "Ignición, autoextinción vs. corte de flujo y llama fría por prueba (333); XO2 0.12–0.85 y 0.5–3.3 bar cubren atmósferas de exploración."
  PSI-10:
