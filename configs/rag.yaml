llm:
  provider: gemini
  model_env: FLAMESAFE_LLM_MODEL   # Explicit deployment choice; no automatic fallback.
  max_tokens: 1500
  temperature: 0.0
embeddings:
  model: intfloat/multilingual-e5-small
  revision: '614241f622f53c4eeff9890bdc4f31cfecc418b3'
retrieval:
  hybrid: true                     # BM25 + dense, reciprocal rank fusion
  top_k: 8
corpus_registry: configs/rag_sources.yaml
answer_contract:
  must_cite: true                  # every claim -> PSI accession / DOI / finding id
  refuse_without_evidence: true
