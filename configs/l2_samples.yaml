# DE-04 · L2 format sampling (docs/02_data_engineering/TRIAGE_METHODOLOGY.md §1).
# Explicit, reviewable list: every file here is downloaded to data/bronze/files/<PSI-ID>/ and profiled.
# Budget: <= 100 MB total, <= 30 MB per file. All experimental tables are always included.
# Selection rationale = first-pass candidates for Tier 1/2 + any processed/"Analyzed" tables that
# could hold measured results (the most valuable thing to discover early).
budget:
  max_total_mb: 100
  max_file_mb: 30
include_experimental_tables: true

samples:
  PSI-10:   # ACME Flame Design — raw per-test stream + chamber calculator
    - "PSI-10_Raw Data_Final ACME Chamber Calculator - 2019-04-09 to 2019-08-13.xlsx"
    - "PSI-10_Raw Data_19196B1_data.csv"            # median-size test, paired with its setpoints
    - "PSI-10_Raw Data_19196B1_mfcSetpoints.csv"
  PSI-159:  # ACME CFI-G
